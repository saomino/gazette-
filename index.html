<style>
/* Layout: alliance dispatch board. Masthead + rubric rail, one lead story, then a grid of dispatches. Ink-blue ground, signal-brass accent. */
:root{
  --bg:#eef0f3; --paper:#ffffff; --ink:#151b26; --muted:#5b6474; --line:#d5d9e1;
  --accent:#b07a12; --accent-ink:#ffffff; --soft:#f6efe0; --danger:#b3261e; --ok:#2e7d4f;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --paper:#171e29; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2a3342;
  --accent:#e2a93b; --accent-ink:#17120a; --soft:#2a2414; --danger:#ff8a80; --ok:#7fd3a0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141c; --paper:#171e29; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2a3342;
  --accent:#e2a93b; --accent-ink:#17120a; --soft:#2a2414; --danger:#ff8a80; --ok:#7fd3a0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding-inline:20px;padding-block:0 60px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}

/* Masthead */
.mast{border-bottom:3px solid var(--ink);padding-block:26px 14px;display:grid;gap:10px}
.mast-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted)}
.mast h1{font-family:var(--display);font-weight:900;font-size:clamp(46px,10vw,104px);line-height:.88;margin:0;letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance}
.mast h1 span{color:var(--accent)}
.nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--paper);padding:6px 12px;border-radius:999px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nav .spacer{flex:1}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:6px;font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.04em}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.5;cursor:default}

/* Lead + grid */
.lead{display:grid;grid-template-columns:1.35fr 1fr;gap:28px;padding-block:28px;border-bottom:1px solid var(--line);cursor:pointer}
.lead .img{max-width:100%;background:var(--soft);border-radius:4px;overflow:hidden;max-height:520px}
.lead .img img,.card .img img{width:100%;height:auto;max-height:inherit;object-fit:cover;object-position:top;display:block}
.img.ph{aspect-ratio:3/2}
.badge{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.badge.new{background:var(--accent);color:var(--accent-ink)}
.badge.pin{border:1px solid var(--accent);color:var(--accent)}
.lead h2{font-family:var(--display);font-weight:700;font-size:clamp(32px,4.5vw,52px);line-height:.98;margin:8px 0 12px;text-transform:uppercase;text-wrap:balance}
.lead p{margin:0;color:var(--muted)}
.tag{color:var(--accent);font-weight:600}
.meta{color:var(--muted);margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:28px 24px;padding-block:28px}
.card{cursor:pointer;display:grid;gap:8px;align-content:start;min-width:0}
.card .img{background:var(--soft);border-radius:4px;overflow:hidden;max-height:340px}
.card h3{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:15px}
.card:hover h3,.lead:hover h2{color:var(--accent)}
.noimg{display:grid;place-items:center;height:100%;font-family:var(--display);font-size:42px;color:var(--accent);opacity:.6}

.empty{padding-block:60px;max-width:560px}
.empty h2{font-family:var(--display);font-size:40px;text-transform:uppercase;margin:0 0 8px}
.empty p{color:var(--muted)}

/* Article */
.article{max-width:720px;margin:0 auto;padding-block:28px}
.article h1{font-family:var(--display);font-weight:900;font-size:clamp(40px,7vw,72px);line-height:.92;margin:10px 0 14px;text-transform:uppercase;text-wrap:balance}
.article .deck{font-size:21px;color:var(--muted);font-style:italic;margin:0 0 18px}
.article .byline{display:flex;gap:10px;align-items:center;border-block:1px solid var(--line);padding-block:10px;margin-bottom:24px;color:var(--muted)}
.byline img{width:28px;height:28px;border-radius:50%}
.prose{min-width:0}
.prose h2{font-family:var(--display);font-size:32px;text-transform:uppercase;margin:32px 0 8px;line-height:1}
.prose h3{font-family:var(--display);font-size:24px;text-transform:uppercase;margin:24px 0 6px}
.prose p{margin:0 0 16px;max-width:65ch}
.prose blockquote{margin:0 0 16px;padding:12px 16px;background:var(--soft);border-radius:4px}
.prose code{font-family:var(--mono);font-size:14px;background:var(--soft);padding:1px 5px;border-radius:3px}
.prose a{color:var(--accent)}
.prose ul,.prose ol{padding-left:22px;margin:0 0 16px}
.prose figure{margin:20px 0}
.prose figure img{width:100%;border-radius:4px;display:block;background:var(--soft);min-height:60px}
.back{background:none;border:0;padding:0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:30px;padding-top:16px;border-top:1px solid var(--line)}

/* Editor */
.editor{max-width:820px;margin:0 auto;padding-block:28px;display:grid;gap:14px}
.editor h2{font-family:var(--display);font-size:40px;text-transform:uppercase;margin:0}
.field{display:grid;gap:6px}
.field label{color:var(--muted)}
.field input,.field select,.field textarea{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
.field textarea{min-height:340px;font-family:var(--mono);font-size:14px;line-height:1.6;resize:vertical}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>.field{flex:1 1 220px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap}
.toolbar button{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:12px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs .t{position:relative;width:96px;height:72px;border-radius:4px;overflow:hidden;border:2px solid transparent;background:var(--soft)}
.thumbs .t.cover{border-color:var(--accent)}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs .t button{position:absolute;inset:auto 0 0 0;border:0;background:rgba(0,0,0,.6);color:#fff;font-family:var(--mono);font-size:10px;padding:2px}
.hint{color:var(--muted);font-size:14px}
.preview{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);padding:10px 12px;border-radius:6px}

/* Salon */
.salon{max-width:760px;margin:0 auto;padding-block:28px;display:grid;gap:14px}
.salon h2{font-family:var(--display);font-size:40px;text-transform:uppercase;margin:0}
.msgs{display:grid;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px;max-height:60vh;overflow:auto}
.msg{display:grid;grid-template-columns:32px 1fr;gap:10px}
.msg img{width:32px;height:32px;border-radius:50%}
.msg .who{font-weight:600}
.msg .when{color:var(--muted);font-family:var(--mono);font-size:11px;margin-left:6px}
.msg .txt{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.send{display:flex;gap:8px}
.send textarea{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px;min-height:48px;resize:vertical}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-family:var(--mono);font-size:13px;z-index:10}
.notice{background:var(--soft);padding:12px 16px;border-radius:6px;margin-top:20px;font-size:15px}

@media (max-width:720px){
  .lead{grid-template-columns:1fr}
  .wrap{padding-inline:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- Images ---------- */
function compress(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{
      const r=Math.min(1,1800/Math.max(im.width,im.height));
      const c=document.createElement("canvas"); c.width=Math.round(im.width*r); c.height=Math.round(im.height*r);
      const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error("Conversion impossible")),"image/jpeg",.85);
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("Ce fichier n'est pas une image lisible."))};
    im.src=url;
  });
}

/* ---------- Mini markdown ---------- */
function inline(s){
  return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g,"<em>$1</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src){
  const lines=String(src||"").replace(/\r/g,"").split("\n"); let html="",para=[],list=null;
  let quote=[];
  const flushQ=()=>{if(quote.length){html+="<blockquote>"+quote.map(inline).join("<br>")+"</blockquote>";quote=[]}};
  const flushP=()=>{if(para.length){html+="<p>"+inline(para.join(" "))+"</p>";para=[]}};
  const flushL=()=>{if(list){html+=`<${list.t}>`+list.items.map(i=>"<li>"+inline(i)+"</li>").join("")+`</${list.t}>`;list=null}};
  for(const raw of lines){
    const l=raw.trim(); let m;
    if(quote.length&&!(l.startsWith("> ")||l===">")) flushQ();
    if(!l){flushP();flushL();continue}
    if((m=l.match(/^\[image:([^\]\s"'<>|]+)(?:\|([^\]]*))?\]$/))){flushP();flushL();const u=imgUrl(m[1]);html+=`<figure><img src="${esc(u)}" alt="${esc(m[2]||"")}" loading="lazy">${m[2]?`<figcaption>${inline(m[2])}</figcaption>`:""}</figure>`;continue}
    if(l.startsWith("### ")){flushP();flushL();html+="<h3>"+inline(l.slice(4))+"</h3>";continue}
    if(l.startsWith("## ")){flushP();flushL();html+="<h2>"+inline(l.slice(3))+"</h2>";continue}
    if(l.startsWith("> ")||l===">"){flushP();flushL();quote.push(l.slice(2));continue}
    if((m=l.match(/^[-*] (.*)$/))){flushP();if(!list||list.t!=="ul"){flushL();list={t:"ul",items:[]}}list.items.push(m[1]);continue}
    if((m=l.match(/^\d+[.)] (.*)$/))){flushP();if(!list||list.t!=="ol"){flushL();list={t:"ol",items:[]}}list.items.push(m[1]);continue}
    flushL(); para.push(l);
  }
  flushP();flushL();flushQ(); return html;
}

/* ---------- Données ---------- */
async function loadArticles(){
  let data=null,error=null;
  try{
    const r=await withTimeout(fetch(SUPABASE_URL+"/rest/v1/articles?select=*&order=created_at.desc&limit=300",{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}}),15000,"articles");
    if(r.ok) data=await r.json(); else error={message:"code "+r.status+" "+(await r.text()).slice(0,120)};

/* ---------- Recherche ---------- */
S.q="";
const norm=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const plain=t=>String(t||"").replace(/\[image:[^\]]*\]/g," ").replace(/[#*>`_-]/g," ");
function snippet(a,words){
  const txt=plain(a.body).replace(/\s+/g," ").trim(), n=norm(txt);
  let i=-1; for(const w of words){const k=n.indexOf(w); if(k>=0&&(i<0||k<i)) i=k}
  if(i<0) return a.deck||txt.slice(0,160);
  const start=Math.max(0,i-60); return (start>0?"… ":"")+txt.slice(start,start+180)+(start+180<txt.length?" …":"");
}
function highlight(text,words){
  let html=esc(text); const n=norm(text);
  const ranges=[]; words.forEach(w=>{let k=n.indexOf(w);while(k>=0&&w){ranges.push([k,k+w.length]);k=n.indexOf(w,k+w.length)}});
  if(!ranges.length) return html;
  ranges.sort((x,y)=>x[0]-y[0]); let out="",pos=0;
  ranges.forEach(([a,b])=>{if(a<pos)return; out+=esc(text.slice(pos,a))+"<mark>"+esc(text.slice(a,b))+"</mark>"; pos=b});
  return out+esc(text.slice(pos));
}
function renderResults(m){
  const words=norm(S.q).split(/\s+/).filter(Boolean);
  const hits=sortArts(S.articles).filter(a=>{
    if(S.cat!=="Tout"&&a.cat!==S.cat) return false;
    const hay=norm([a.title,a.deck,plain(a.body),a.author_name,a.cat].join(" "));
    return words.every(w=>hay.includes(w));
  });
  m.innerHTML=`<p class="results mono">${hits.length} article${hits.length>1?"s":""} pour « ${esc(S.q.trim())} »${S.cat!=="Tout"?" dans "+esc(S.cat.toLowerCase())+"s":""}</p>`+
    (hits.length?`<section class="grid">${hits.map(a=>`<article class="card" data-id="${esc(a.id)}">${cover(a)}<div class="mono">${tags(a)} · ${fmtDate(a.created_at)}</div><h3>${highlight(a.title,words)}</h3><p>${highlight(snippet(a,words),words)}</p>${countsLine(a)}</article>`).join("")}</section>`
    :`<div class="empty"><p>Aucun article ne contient ce mot. Essayez un autre mot ou vérifiez l'orthographe.</p></div>`);
  m.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>go(el.dataset.id));
}

const sortArts=l=>[...l].sort((x,y)=>(y.pinned?1:0)-(x.pinned?1:0)||Date.parse(y.created_at)-Date.parse(x.created_at));

  <p class="hint" style="margin:0">${esc(S.session.user.email)} · ${S.chef?"Chef de la Gazette":S.admin?"Administrateur":"Demande en attente"}</p>
  <form class="field" id="cp"><label class="mono" for="c-pseudo">Pseudo d'auteur</label><div class="send"><input id="c-pseudo" maxlength="40" value="${esc(pseudo())}" style="flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px"><button class="btn" type="submit">Enregistrer</button></div></form>
  <form class="field" id="cw"><label class="mono" for="c-pass">Nouveau mot de passe (8 caractères minimum)</label><input id="c-pass" type="password" minlength="8" autocomplete="new-password" required><input id="c-pass2" type="password" minlength="8" autocomplete="new-password" placeholder="Confirmer" required><div class="err" id="cerr"></div><div><button class="btn" type="submit">Changer le mot de passe</button></div></form>
  <div><button class="btn ghost" id="cback">← Retour à la une</button></div></div>`;
  $("#cback").onclick=goBack;
  $("#cp").onsubmit=async e=>{e.preventDefault();const v=$("#c-pseudo").value.trim();if(v)await savePseudo(v)};
  $("#cw").onsubmit=async e=>{
    e.preventDefault();const a=$("#c-pass").value,b=$("#c-pass2").value;
    if(a!==b){$("#cerr").textContent="Les deux mots de passe ne sont pas identiques.";return}
    const {error}=await S.sb.auth.updateUser({password:a});
    if(error) $("#cerr").textContent="Changement impossible : "+error.message; else {$("#cerr").textContent="";$("#c-pass").value="";$("#c-pass2").value="";toast("Mot de passe changé")}
  };
}
function renderEquipe(m){
  const link=location.origin+location.pathname+"#rejoindre";
  const wait=S.team.filter(x=>x.status==="en_attente"), team=S.team.filter(x=>x.status==="admin"||x.status==="chef");
  const row=(x,btns)=>`<div class="msg" style="grid-template-columns:1fr auto;align-items:center"><div style="min-width:0"><span class="who"></span> <span class="when"></span><div class="hint mail"></div></div><div class="row" style="gap:6px">${btns}</div></div>`;
  m.innerHTML=`<div class="salon"><h2>Équipe de la Gazette</h2>
  <div class="field"><span class="mono" style="color:var(--muted)">Lien à envoyer aux futurs admins</span>
  <div class="send"><input id="e-link" readonly value="${esc(link)}" style="flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px"><button class="btn" id="e-copy">Copier</button></div>
  <span class="hint">La personne remplit le formulaire, puis sa demande apparaît ici. Rien ne se passe sans votre accord.</span></div>
  <h3 class="mono" style="margin:10px 0 0">Demandes en attente (${wait.length})</h3>
  <div class="msgs" id="e-wait"></div>
  <h3 class="mono" style="margin:10px 0 0">Administrateurs (${team.length})</h3>
  <div class="msgs" id="e-team"></div></div>`;
  $("#e-copy").onclick=async()=>{try{await navigator.clipboard.writeText(link);toast("Lien copié")}catch(e){$("#e-link").select();toast("Sélectionnez le lien et copiez-le")}};
  const fill=(box,list,mkBtns,empty)=>{
    box.innerHTML=list.length?"":`<p class="hint" style="margin:0">${empty}</p>`;
    list.forEach(x=>{
      const d=document.createElement("div"); d.innerHTML=row(x,mkBtns(x)); const r=d.firstElementChild;
      r.querySelector(".who").textContent=x.pseudo||"(sans pseudo)";
      r.querySelector(".when").textContent=x.status==="chef"?"· chef":"· "+fmtDate(x.created_at);
      r.querySelector(".mail").textContent=x.email||"";
      r.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act,x,r));
      box.appendChild(r);
    });
  };
  fill($("#e-wait"),wait,()=>`<button class="btn" data-act="ok">Accepter</button><button class="btn danger" data-act="no">Refuser</button>`,"Aucune demande pour le moment.");
  fill($("#e-team"),team,x=>x.status==="chef"?"":`<button class="btn danger" data-act="del">Retirer</button>`,"Aucun admin.");
}
async function act(kind,x,rowEl){
  if(kind==="del"||kind==="no"){
    const box=rowEl.querySelector(".row");
    if(!box.dataset.confirm){box.dataset.confirm="1";box.innerHTML=`<span class="hint">${kind==="del"?"Retirer":"Refuser"} ?</span><button class="btn danger" data-c="y">Oui</button><button class="btn ghost" data-c="n">Non</button>`;
      box.querySelector('[data-c="n"]').onclick=()=>render();
      box.querySelector('[data-c="y"]').onclick=()=>act(kind+"!",x,rowEl);return}
  }
  const fn=kind==="ok"?"accepter_admin":"retirer_admin";
  const {error}=await S.sb.rpc(fn,{uid:x.id});
  if(error) return toast("Action impossible : "+error.message);
  toast(kind==="ok"?"Admin accepté":kind==="no!"?"Demande refusée":"Admin retiré");
  await loadTeam(); render();
}


/* ---------- Éditeur ---------- */
function openEditor(a){
  S.draft=a?{id:a.id,title:a.title,cat:a.cat,deck:a.deck||"",body:a.body||"",cover:a.cover||null,images:[...(a.images||[])],isNew:false,preview:false}
           :{id:null,title:"",cat:"Annonce",deck:"",body:"",cover:null,images:[],isNew:true,preview:false};
  go("ecrire");
}
function renderEditor(m){
  const d=S.draft;
  m.innerHTML=`<div class="editor">
  <button class="back mono" id="cancel">← Annuler</button>
  <h2>${d.isNew?"Nouvel article":"Modifier l'article"}</h2>
  <div class="row"><div class="field"><label class="mono" for="f-title">Titre</label><input id="f-title" maxlength="140" value="${esc(d.title)}" placeholder="Ex. : Guide des événements du week-end"></div>
  <div class="field" style="flex:0 1 200px"><label class="mono" for="f-cat">Rubrique</label><select id="f-cat">${CATS.map(c=>`<option ${c===d.cat?"selected":""}>${c}</option>`).join("")}</select></div></div>
  <div class="field"><label class="mono" for="f-deck">Chapeau (résumé d'une phrase)</label><input id="f-deck" maxlength="240" value="${esc(d.deck)}" placeholder="Ce que le lecteur va apprendre"></div>
  <div class="field"><label class="mono" for="f-body">Texte</label>
    <div class="toolbar"><button type="button" data-ins="## ">Intertitre</button><button type="button" data-wrap="**">Gras</button><button type="button" data-wrap="*">Italique</button><button type="button" data-ins="- ">Liste</button><button type="button" data-ins="1. ">Étapes</button><button type="button" data-ins="> ">Encadré</button><button type="button" id="addimg">+ Images</button><button type="button" id="prev">${d.preview?"Éditer":"Aperçu"}</button></div>
    <input type="file" id="f-files" accept="image/*" multiple hidden>
    ${d.preview?`<div class="preview prose">${md(d.body)||"<p class='hint'>Rien à afficher.</p>"}</div>`:`<textarea id="f-body" placeholder="Écrivez votre tuto ici. Laissez une ligne vide entre les paragraphes.">${esc(d.body)}</textarea>`}
    <div class="hint">Les images s'insèrent là où se trouve le curseur. Formats : <code>## Intertitre</code>, <code>**gras**</code>, <code>- liste</code>, <code>1. étape</code>. Légende sous une image : ajoutez <code>|votre légende</code> avant le <code>]</code>, par ex. <code>[image:…|Écran des alliances]</code>.</div>
  </div>
  <div class="field"><span class="mono" style="color:var(--muted)">Images de l'article — cliquez sur une image pour en faire la couverture</span><div class="thumbs" id="thumbs"></div></div>
  <div class="row" style="align-items:center"><button class="btn" id="save">${d.isNew?"Publier":"Enregistrer"}</button><span class="hint" id="status"></span></div>
  </div>`;
  const body=$("#f-body");
  const sync=()=>{d.title=$("#f-title").value;d.cat=$("#f-cat").value;d.deck=$("#f-deck").value;if(body)d.body=body.value};
  ["f-title","f-cat","f-deck","f-body"].forEach(id=>{const el=document.getElementById(id);if(el)el.oninput=sync});
  $("#cancel").onclick=()=>{S.draft=null;goBack()};
  $("#prev").onclick=()=>{sync();d.preview=!d.preview;renderEditor(m)};
  m.querySelectorAll("[data-ins]").forEach(b=>b.onclick=()=>{if(!body)return;const s=body.selectionStart;const ls=body.value.lastIndexOf("\n",s-1)+1;body.setRangeText(b.dataset.ins,ls,ls,"end");body.focus();sync()});
  m.querySelectorAll("[data-wrap]").forEach(b=>b.onclick=()=>{if(!body)return;const w=b.dataset.wrap,s=body.selectionStart,e=body.selectionEnd;body.setRangeText(w+(body.value.slice(s,e)||"texte")+w,s,e,"end");body.focus();sync()});
  $("#addimg").onclick=()=>$("#f-files").click();
  $("#f-files").onchange=async ev=>{
    const files=[...ev.target.files]; ev.target.value=""; if(!files.length) return;
    const st=$("#status");
    for(const [i,f] of files.entries()){
      st.textContent=`Envoi de l'image ${i+1}/${files.length}…`;
      try{
        const blob=await compress(f);
        const path=Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg";
        const {error}=await S.sb.storage.from("images").upload(path,blob,{contentType:"image/jpeg"});
        if(error) throw error;
        d.images.push(path); if(!d.cover) d.cover=path; S.blobs=S.blobs||{}; S.blobs[path]=blob;
        const token=`\n[image:${path}]\n`; const ta=$("#f-body");
        if(ta){ta.setRangeText(token,ta.selectionStart,ta.selectionEnd,"end");d.body=ta.value}else d.body+=token;
      }catch(e){toast("Image non envoyée : "+(e.message||e))}
    }
    st.textContent=""; drawThumbs();
  };
  $("#save").onclick=save;
  drawThumbs();
}
function drawThumbs(){
  const d=S.draft,box=$("#thumbs"); if(!box) return;
  box.innerHTML=d.images.length?"":`<span class="hint">Aucune image pour l'instant. Utilisez « + Images ».</span>`;
  d.images.forEach(p=>{
    const w=document.createElement("div"); w.className="tw";
    const t=document.createElement("div"); t.className="t"+(d.cover===p?" cover":"");
    t.innerHTML=`<img alt=""><button type="button">Retirer</button>`;
    w.appendChild(t);
    t.querySelector("img").src=imgUrl(p);
    t.querySelector("img").onclick=()=>{d.cover=p;drawThumbs()};
    t.querySelector("button").onclick=()=>{
      d.images=d.images.filter(x=>x!==p); if(d.cover===p) d.cover=d.images[0]||null;
      d.body=d.body.split("[image:"+p+"]").join("");
      const ta=$("#f-body"); if(ta) ta.value=d.body; drawThumbs();
    };
    box.appendChild(w);
  });
}
async function save(){
  const d=S.draft; const ta=$("#f-body"); if(ta) d.body=ta.value;
  d.title=$("#f-title").value.trim(); d.cat=$("#f-cat").value; d.deck=$("#f-deck").value.trim();
  const st=$("#status");
  if(!d.title){st.textContent="Donnez un titre à l'article.";$("#f-title").focus();return}
  if(!d.body.trim()){st.textContent="L'article est vide : écrivez au moins un paragraphe.";return}
  $("#save").disabled=true; st.textContent="Publication…";
  const row={title:d.title,cat:d.cat,deck:d.deck,body:d.body,cover:d.cover||null,images:d.images};
  let res;
  if(d.isNew) res=await S.sb.from("articles").insert({...row,author_name:pseudo()||"Un administrateur"}).select().single();
  else res=await S.sb.from("articles").update({...row,edited_at:new Date().toISOString()}).eq("id",d.id).select().single();
  if(res.error){$("#save").disabled=false;st.textContent="Publication impossible : "+res.error.message;return}
  toast(d.isNew?"Article publié":"Modifications enregistrées");
  const wasNew=d.isNew; S.draft=null; await loadArticles(); if(!wasNew&&S.inApp&&history.length>1) history.back(); else location.replace("#"+res.data.id);
}

/* ---------- Salon des admins ---------- */
async function loadSalon(){
  const {data,error}=await S.sb.from("salon").select("*").order("created_at",{ascending:false}).limit(150);
  if(!error){S.salon=data.reverse(); drawMsgs()}
}
function renderSalon(m){
  m.innerHTML=`<div class="salon"><h2>Salon des admins</h2><p class="hint" style="margin:0">Visible uniquement par les administrateurs connectés.</p>
  <div class="msgs" id="msgs"><p class="hint" style="margin:0">Chargement…</p></div>
  <form class="send" id="sendf"><label for="f-msg" hidden>Message</label><textarea id="f-msg" placeholder="Écrire aux autres admins… (Entrée pour envoyer)"></textarea><button class="btn" type="submit">Envoyer</button></form></div>`;
  loadSalon();
  clearInterval(S.salonTimer);
  S.salonTimer=setInterval(()=>{if(S.view==="salon"&&!document.hidden)loadSalon();else if(S.view!=="salon")clearInterval(S.salonTimer)},8000);
  const ta=$("#f-msg");
  ta.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#sendf").requestSubmit()}};
  $("#sendf").onsubmit=async e=>{
    e.preventDefault(); const text=ta.value.trim(); if(!text) return; ta.value="";
    const {error}=await S.sb.from("salon").insert({text:text.slice(0,4000),author_name:pseudo()||S.session.user.email});
    if(error){ta.value=text;toast("Message non envoyé : "+error.message)} else loadSalon();
  };
}
function drawMsgs(){
  const box=$("#msgs"); if(!box) return;
  if(!S.salon.length){box.innerHTML=`<p class="hint" style="margin:0">Aucun message. Lancez la discussion.</p>`;return}
  const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<40;
  box.innerHTML="";
  S.salon.forEach(x=>{
    const r=document.createElement("div"); r.className="msg"; r.style.gridTemplateColumns="1fr";
    r.innerHTML=`<div style="min-width:0"><span class="who"></span><span class="when"></span><div class="txt"></div></div>`;
    r.querySelector(".who").textContent=x.author_name||"Admin";
    r.querySelector(".when").textContent=fmtTime(x.created_at);
    r.querySelector(".txt").textContent=x.text;
    box.appendChild(r);
  });
  if(atBottom||!drawMsgs._done){box.scrollTop=box.scrollHeight;drawMsgs._done=true}
}

/* ---------- Navigation (bouton retour du téléphone) ---------- */
const PAGES=["rejoindre","salon","equipe","compte","login"];
function toTop(){requestAnimationFrame(()=>{window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0})}
function route(){
  closeLb(true);
  const h=decodeURIComponent(location.hash.slice(1));
  if(!h) S.view="list";
  else if(PAGES.includes(h)) S.view=h;
  else if(h==="ecrire") S.view=S.draft?"editor":"list";
  else {S.view="article";S.openId=h}
  render(); toTop();
}
function go(h){
  S.inApp=true;
  if(decodeURIComponent(location.hash.slice(1))===h) route(); else location.hash=h;
}
function goBack(){ if(S.inApp&&history.length>1) history.back(); else location.replace("#"); }
window.addEventListener("hashchange",route);
/* Image en grand */
function openLb(src){
  closeLb(true);
  const d=document.createElement("div"); d.className="lb"; d.innerHTML=`<span>Fermer ✕</span><img alt=""><div class="lbbar"><button type="button">Fermer · Close</button></div>`; d.querySelector("img").src=src;
  d.querySelector(".lbbar").onclick=e=>{ if(e.target.tagName!=="BUTTON") e.stopPropagation(); };
  d.onclick=()=>history.back();
  document.body.appendChild(d); S.lb=d; history.pushState({lb:1},"");
}
function closeLb(silent){ if(S.lb){S.lb.remove();S.lb=null} }
window.addEventListener("popstate",()=>{ if(S.lb) closeLb(); });
document.addEventListener("click",e=>{
  if(e.target.closest(".lb")) return;
  const img=e.target.closest(".article img"); if(img&&img.src) {e.preventDefault();openLb(img.src)}
});

/* ---------- Démarrage ---------- */
function showDiag(msg){
  let d=document.getElementById("diag");
  if(!d){d=document.createElement("div");d.id="diag";d.className="notice mono";d.style.fontSize="12px";d.style.textTransform="none";document.querySelector(".wrap").appendChild(d)}
  const line=document.createElement("div");line.textContent="Problème technique : "+msg;d.appendChild(line);
}
window.addEventListener("error",e=>showDiag((e.message||"erreur")+(e.filename?" ("+e.filename.split("/").pop()+":"+e.lineno+")":"")));
window.addEventListener("unhandledrejection",e=>showDiag(String((e.reason&&e.reason.message)||e.reason)));
const withTimeout=(p,ms,label)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(label+" : pas de réponse après "+ms/1000+" s")),ms))]);
(async()=>{
  render();
  if(!window.supabase){
    S.loaded=true; S.error="Le module de connexion n'a pas pu se charger. Vérifiez votre connexion internet puis rechargez la page.";
    render(); return;
  }
  try{ S.sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,lock:async(_name,_timeout,fn)=>await fn()}}); }
  catch(e){ S.loaded=true; S.error="Connexion à la base impossible ("+e.message+")."; render(); return; }
  route();
  loadArticles().catch(e=>{S.loaded=true;S.error="Impossible de charger les articles ("+e.message+").";render()});
  try{
    const r=await withTimeout(S.sb.auth.getSession(),10000,"session");
    S.session=r.data.session;
    await withTimeout(loadMe(),10000,"profil");
  }catch(e){ showDiag(e.message); }
  S.sb.auth.onAuthStateChange((ev,session)=>{
    const changed=(session&&session.user.id)!==(S.session&&S.session.user.id);
    S.session=session;
    if(changed||ev==="SIGNED_OUT"){setTimeout(async()=>{try{await loadMe()}catch(e){showDiag(e.message)}if(S.view!=="editor")render()},0)}
  });
  if(S.view!=="editor") render();
  /* Une demande en attente se met à jour toute seule dès que le chef l'accepte */
  const recheck=async()=>{
    if(!S.session||!S.me||S.me.status!=="en_attente"||document.hidden) return;
    try{await loadMe()}catch(e){return}
    if(S.admin){toast("Votre demande est acceptée : vous êtes admin !");location.replace("#");route()}
  };
  setInterval(recheck,10000);
  document.addEventListener("visibilitychange",recheck);
  window.addEventListener("focus",recheck);
  /* Le chef voit arriver les nouvelles demandes sans recharger */
  setInterval(async()=>{if(S.chef&&!document.hidden&&S.view!=="editor"){const before=S.team.length;await loadTeam();if(S.team.length!==before)render()}},20000);
})();
</script>
</body>
</html>
